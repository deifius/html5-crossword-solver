<!DOCTYPE html>
<html>
<head lang="en">
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="HandheldFriendly" content="True">
    <title>Sample INASRA Hosted Solver</title>

    <script>
      window.INASRA_SOLVE = {
        username: "inasra",
        puzzleId: "xw_example_nonspoiler_001",
        publicTitle: "Sample INASRA Hosted Puzzle",
        puzzleUrl: "sample_puzzles/Route_66.ipuz",
        puzzleType: "ipuz",
        manifestUrl: "sample_puzzles/inasra-example-manifest.json",
        theme: "inasra",
        solverParams: {
          dark_mode_enabled: true
        }
      };
    </script>

    <!-- jQuery -->
    <script src="lib/jquery.js"></script>

    <!-- for loading crosswords -->
    <script src="lib/jscrossword_combined.js"></script>

    <!-- confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- GG animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha512-16esztaSRplJROstbIIdwX3N97V1+pZvV33ABoG1H2OyTttBxEGkTsoIVsiP1iaTtM8b3+hu2kB6pQ4Clr5yug==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- Shared JS -->
    <script src="js/crossword.shared.js"></script>

    <!-- INASRA hosted-mode helpers -->
    <script src="js/inasra-wallpaper.js"></script>
    <script src="js/inasra-solver-boot.js"></script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="./css/crossword.shared.css">

    <meta name="theme-color" content="#050711">

    <script>
        const mobile = CrosswordShared.isMobileDevice();
        console.log('[Device Detection]', {
          ua: navigator.userAgent,
          platform: navigator.platform,
          maxTouchPoints: navigator.maxTouchPoints,
          isMobile: mobile
        });

        if (mobile) {
          const core = document.createElement('script');
          core.src = './js/crosswords.js';

          core.onload = () => {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = './css/crossword.mobile.css';
            document.head.appendChild(link);
            window.InasraSolver?.ensureThemeStylesheet?.();

            const mobileScript = document.createElement('script');
            mobileScript.src = './js/crossword.mobile.js';
            document.body.appendChild(mobileScript);
          };

          window.addEventListener('DOMContentLoaded', () => {
            document.body.appendChild(core);
          });

        } else {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './css/crosswordnexus.css';
          document.head.appendChild(link);
          window.InasraSolver?.ensureThemeStylesheet?.();

          const script = document.createElement('script');
          script.src = './js/crosswords.js';
          script.onload = () => {
            console.log('[Desktop] crosswords.js loaded — initializing crossword');

            const params = CrosswordShared.getCrosswordParams();

            window.gCrossword = CrosswordNexus.createCrossword($('div.crossword'), params);

            setTimeout(() => {
              const svg = document.getElementById('cw-puzzle-grid');
              const cw = window.gCrossword;

              if (svg && cw?.renderCells && cw.grid_width && cw.grid_height) {
                console.log('[Fix] Final render pass after layout settle');
                cw.renderCells();
                cw.windowResized?.();
                cw.syncTopTextWidth?.();
              } else {
                console.warn('[Fix] Skipping renderCells — grid size not yet initialized', {
                  grid_width: cw?.grid_width,
                  grid_height: cw?.grid_height
                });
              }
            }, 350);
          };

          window.addEventListener('DOMContentLoaded', () => {
            document.body.appendChild(script);
          });
        }
      </script>

      <noscript>
        <p style="padding:1rem; font-family:sans-serif;">
          The INASRA Crossword Solver requires JavaScript.
        </p>
      </noscript>
</head>
<body>
    <div id="inasra-wallpaper-layer" aria-hidden="true"></div>
    <header class="inasra-solve-topbar" aria-label="INASRA puzzle header">
      <a class="inasra-brand" href="/">INASRA</a>
      <div class="inasra-puzzle-meta">
        <span id="inasra-puzzle-title">Sample INASRA Hosted Puzzle</span>
        <span id="inasra-puzzle-author">by inasra</span>
      </div>
      <a class="inasra-create-link" href="/">Create your own</a>
    </header>
    <div class="crossword"></div>
</body>
</html>
